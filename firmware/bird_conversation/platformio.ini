; bird_conversation — VAD POC sketch (standalone PlatformIO project)
[platformio]
src_dir  = .
data_dir = data

[env:bird_conversation]
platform                = espressif32
board                   = seeed_xiao_esp32s3
framework               = arduino
monitor_speed           = 115200
upload_speed            = 921600
board_build.filesystem  = littlefs
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
