; mic_test — ADC diagnostic sketch (standalone PlatformIO project)
[platformio]
src_dir = .

[env:mic_test]
platform      = espressif32
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
