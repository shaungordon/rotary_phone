; dial_tone_test — Simple audio playback test (standalone PlatformIO project)
; Tests I2S audio output without any pin inputs to isolate hardware issues
[platformio]
src_dir = .

[env:dial_tone_test]
platform      = espressif32
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
