; ringer_test — Standalone ringer hardware test (PlatformIO project)
; Tests the 20Hz alternating signal for the telephone ringer mechanism
; with North American ring cadence (2s on / 4s off).
[platformio]
src_dir = .

[env:ringer_test]
platform      = espressif32
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
