; =============================================================================
; Rotary Phone — PlatformIO configuration
; Hardware: Seeed XIAO ESP32S3 (8MB flash)
; Primary sketch: firmware/rotary_phone
; =============================================================================

[platformio]
default_envs = rotary_phone
src_dir  = firmware/rotary_phone
data_dir = firmware/rotary_phone/data

; ----------------------------------------------------------------------------
; Shared settings inherited by all environments
; ----------------------------------------------------------------------------
[env]
platform      = espressif32
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
; XIAO ESP32S3 uses native USB — required for Serial output
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; ----------------------------------------------------------------------------
; [PRIMARY] rotary_phone — production firmware
; ----------------------------------------------------------------------------
[env:rotary_phone]
board_build.partitions = firmware/partitions_8mb_ffat.csv
board_build.filesystem = fatfs
; Requires v2.x — ble_debug.h uses NimBLEConnInfo& callback signatures (2.x API).
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.0.0
