; =============================================================================
; Rotary Phone — PlatformIO configuration
; Hardware: Seeed XIAO ESP32S3 (8MB flash)
; Primary sketch: firmware/rotary_phone
; =============================================================================

[platformio]
default_envs = rotary_phone
src_dir = .

; ----------------------------------------------------------------------------
; Shared settings inherited by all environments
; ----------------------------------------------------------------------------
[env]
platform      = espressif32
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
; XIAO ESP32S3 uses native USB — required for Serial output
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; ----------------------------------------------------------------------------
; [PRIMARY] rotary_phone — production firmware
; ----------------------------------------------------------------------------
[env:rotary_phone]
build_src_filter = +<firmware/rotary_phone/> -<.git/> -<docs/> -<sounds/> -<vad_prototype/>
board_build.partitions = firmware/partitions_8mb_ffat.csv
board_build.filesystem = fatfs
board_build.arduino.memory_type = qio_qspi ; For PSRAM support if needed
; Requires v2.x — ble_debug.h uses NimBLEConnInfo& callback signatures (2.x API).
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.0.0

; ----------------------------------------------------------------------------
; [TEST] dial_tone_test — Simple audio playback test
; Tests I2S audio output without any pin inputs to isolate hardware issues
; ----------------------------------------------------------------------------
[env:dial_tone_test]
build_src_filter = +<firmware/dial_tone_test/> -<.git/> -<docs/> -<sounds/> -<vad_prototype/>

; ----------------------------------------------------------------------------
; [TEST] mic_test — ADC diagnostic sketch
; ----------------------------------------------------------------------------
[env:mic_test]
build_src_filter = +<firmware/mic_test/> -<.git/> -<docs/> -<sounds/> -<vad_prototype/>

; ----------------------------------------------------------------------------
; [PROTOTYPE] bird_conversation — VAD POC sketch
; ----------------------------------------------------------------------------
[env:bird_conversation]
build_src_filter = +<firmware/bird_conversation/> -<.git/> -<docs/> -<sounds/> -<vad_prototype/>
board_build.filesystem = littlefs

; ----------------------------------------------------------------------------
; [TEST] ringer_test — 20Hz alternating signal / NA ring cadence test
; ----------------------------------------------------------------------------
[env:ringer_test]
build_src_filter = +<firmware/ringer_test/> -<.git/> -<docs/> -<sounds/> -<vad_prototype/>
